name: Deployment Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify-code:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Types Check
        run: npm run ts:check

      - name: Linting Check
        run: npm run lint

      - name: Unit Testing
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright OS Dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

  deploy-code:
    if: github.event_name == 'push'
    needs: [verify-code]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  tag_release:
    runs-on: ubuntu-latest
    needs: [deploy-code]
    permissions:
      contents: write
    env:
      COMMIT_MESSAGES: ${{toJson(github.event.commits.*.message)}}
    if: >-
      github.event_name == 'push' &&
      !contains(toJson(github.event.commits.*.message), '#skip')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump git tag version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch
          DRY_RUN: false

  discord_notification:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    needs: [deploy-code, verify-code]
    steps:
      - name: Notify Discord on success
        if: needs.deploy-code.result == 'success'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: 'Deployment successful'
          content: '✅ **Deployment Successful!** A new version deployed to production'
          description: |
            **Repository:** ${{github.event.repository.full_name}}
            **Branch:** ${{github.ref_name}}
            **Commit:** ${{github.event.head_commit.id}}
            **Message:** ${{github.event.head_commit.message}}
            **Author:** ${{github.event.head_commit.author.name}}
            **Workflow:** ${{github.workflow}}
            **Job:** ${{github.job}}

      - name: Notify Discord on failure
        if: needs.verify-code.result == 'failure' || needs.deploy-code.result == 'failure'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: 'Deployment failed'
          content: '❌ **Build Failed!** The pipeline encountered an error'
          description: |
            **Commit:** ${{github.event.head_commit.id}}
            **Message:** ${{github.event.head_commit.message}}
            **Author:** ${{github.event.head_commit.author.name}}
